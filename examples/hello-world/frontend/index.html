<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hello World</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #1a1a2e;
            color: #eee;
        }
        .container { text-align: center; max-width: 500px; }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        p { font-size: 1.2rem; opacity: 0.7; }
        button {
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            background: #4a90d9;
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: #357abd; }
        #result { margin-top: 1rem; font-size: 1.1rem; min-height: 1.5em; }
        .input-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
            justify-content: center;
        }
        input[type="text"] {
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #555;
            border-radius: 4px;
            background: #2a2a4e;
            color: #eee;
            outline: none;
            width: 200px;
        }
        input[type="text"]:focus {
            border-color: #4a90d9;
        }
        #echo-result {
            margin-top: 0.75rem;
            font-size: 1rem;
            opacity: 0.8;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from Servo!</h1>
        <p>This app is running on the lightweight runtime.</p>

        <button onclick="greet()">Greet</button>
        <div id="result"></div>

        <div class="input-row">
            <input type="text" id="name-input" placeholder="Type your name...">
            <button onclick="greetByName()">Say Hello</button>
        </div>
        <div id="echo-result"></div>
    </div>
    <script>
        async function greet() {
            if (!window.__runtime) return;
            const response = await window.__runtime.invoke('greet', { name: 'Servo' });
            document.getElementById('result').textContent = response.greeting;
        }

        async function greetByName() {
            if (!window.__runtime) return;
            const name = document.getElementById('name-input').value || 'World';
            const response = await window.__runtime.invoke('greet', { name });
            document.getElementById('echo-result').textContent = response.greeting;
        }

        document.getElementById('name-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') greetByName();
        });
    </script>
</body>
</html>
