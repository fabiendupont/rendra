[package]
name = "runtime-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "runtime_cli"
path = "src/lib.rs"

[[bin]]
name = "runtime-cli"
path = "src/main.rs"

[dependencies]
runtime-sandbox = { path = "../runtime-sandbox" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
