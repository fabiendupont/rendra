[package]
name = "runtime-bindgen"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "runtime_bindgen"
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
