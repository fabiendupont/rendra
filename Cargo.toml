[workspace]
resolver = "2"
members = [
    "crates/runtime-api",
    "crates/runtime-cli",
    "crates/runtime-core",
    "crates/runtime-ipc",
    "crates/runtime-macros",
    "crates/runtime-sandbox",
    "runtime-bindgen",
    "examples/hello-world",
    "examples/markdown-notes",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"

# For final distribution builds (much slower compile, ~5-10% smaller):
# lto = "fat"
# codegen-units = 1

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
euclid = "0.22"
